version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: api-conformance-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant/storage:/qdrant/storage
    networks:
      - backend-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: api-conformance-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: conformance_checker
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge
